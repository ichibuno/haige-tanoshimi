    <title>ハイゲFINAL 非公式応援サイト（公開用）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141c;
        --surface: #1c1f2a;
        --surface-2: #262a38;
        --text: #f5f1e8;
        --dim: #a49e90;
        --border: #333849;
        --accent: #f5f1e8;
        --accent-strong: #f5f1e8;
        --accent-ink: #12141c;
        --live: #ff5147;
        --twitch: #a970ff;
        --youtube: #ff4d6d;
        --radius: 14px;
        --schedule-accent: #b9bbbd;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN",
          "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-weight: 400;
      }
      /* No white focus frame after click/tap anywhere. */
      :focus, :focus-visible { outline: none; }
      button, [role="button"], select, summary,
      input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
      button { font-family: inherit; cursor: pointer; }
      a { color: inherit; }
      ul { list-style: none; margin: 0; padding: 0; }
      p { margin: 0; }
      h1, h2 { margin: 0; font-weight: 400; }

      .jp-wrap { line-break: strict; word-break: auto-phrase; }
      .text-pretty { text-wrap: pretty; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      @keyframes live-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.8); }
      }
      .live-dot {
        display: inline-block; border-radius: 9999px; background: #ff5147;
        animation: live-pulse 1.6s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .live-dot { animation: none; }
      }

      .wrap { margin: 0 auto; width: 100%; max-width: 1280px; padding: 0 16px 40px; }
      main { display: block; }

      /* ---------- sticky header ---------- */
      .site-header {
        position: sticky; top: 0; z-index: 40;
        margin: 0 -16px; padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      @media (min-width: 640px) { .site-header { padding-top: 6px; padding-bottom: 6px; } }
      .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .header-col { display: flex; min-width: 0; flex-direction: column; gap: 11px; }
      @media (min-width: 640px) { .header-col { gap: 13px; } }
      .event-line { font-size: 12px; line-height: 1.25; color: var(--dim); }
      .event-line .ev-name, .event-line .ev-date { display: block; }
      .event-line .ev-sep { display: none; }
      @media (min-width: 640px) {
        .event-line .ev-name, .event-line .ev-date { display: inline; }
        .event-line .ev-sep { display: inline; }
      }
      .site-title {
        white-space: nowrap; line-height: 1.25;
        font-size: min(4.2vw, 20px);
      }
      @media (min-width: 640px) { .site-title { font-size: 20px; } }
      .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
      .tab-btn {
        border-radius: 9999px; padding: 4px 12px; font-size: 14px; line-height: 1.5;
        background: var(--surface); color: var(--text); border: 1px solid var(--border);
      }
      .tab-btn[aria-pressed="true"] {
        background: var(--accent); color: var(--accent-ink); border-color: transparent;
      }
      .count-badge {
        display: flex; height: 96px; width: 96px; flex-shrink: 0;
        align-items: center; justify-content: center; border-radius: 9999px;
        text-align: center; font-size: 14px; line-height: 1.25; color: var(--text);
        background: var(--surface); border: 2px solid var(--accent);
        padding: 6px;
      }
      @media (min-width: 640px) { .count-badge { height: 112px; width: 112px; font-size: 16px; } }
      .count-stack { display: flex; flex-direction: column; align-items: center; }
      .count-ato { font-size: 11px; line-height: 1; }
      @media (min-width: 640px) { .count-ato { font-size: 12px; } }
      .count-num-row { margin-top: 4px; display: flex; align-items: baseline; }
      .count-num { font-size: 36px; font-weight: 700; line-height: 1; }
      @media (min-width: 640px) { .count-num { font-size: 48px; } }
      .count-day { margin-left: 2px; font-size: 16px; line-height: 1; }
      @media (min-width: 640px) { .count-day { font-size: 18px; } }

      /* ---------- hero (live count) ---------- */
      .hero { margin-top: 20px; }
      .hero-row { display: flex; flex-wrap: wrap; align-items: flex-end; column-gap: 16px; row-gap: 8px; }
      .hero-count { font-size: 20px; line-height: 1; }
      .hero-meta { padding-bottom: 2px; font-size: 14px; color: var(--dim); }

      /* ---------- link frames ---------- */
      .link-frame {
        display: flex; align-items: center; gap: 12px;
        border-radius: var(--radius); background: var(--surface-2);
        padding: 12px 16px; border: 2px solid var(--text);
        text-decoration: none; height: 100%;
      }
      .link-chip {
        display: inline-flex; width: 96px; flex-shrink: 0; align-items: center;
        justify-content: center; border-radius: 9999px; padding: 4px 10px; font-size: 12px;
      }
      .link-text { min-width: 0; }
      .link-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
      .link-name .note { font-size: 12px; color: var(--dim); }
      .link-desc { display: block; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .link-desc.full { white-space: normal; text-wrap: pretty; }
      .link-arrow { margin-left: auto; flex-shrink: 0; color: var(--dim); }

      /* ---------- official fold section ---------- */
      .official {
        margin-top: 20px; border-radius: var(--radius);
        background: var(--surface); padding: 16px; border: 2px solid var(--accent);
      }
      .official-toggle {
        display: flex; width: 100%; align-items: center; justify-content: space-between;
        gap: 8px; text-align: left; background: none; border: 0; padding: 0; color: var(--text);
        font-size: 16px;
      }
      .chev { flex-shrink: 0; font-size: 14px; color: var(--dim); transition: transform 0.15s ease; }
      .chev.open { transform: rotate(180deg); }
      .official-body { margin-top: 16px; }
      .main-broadcast-head { display: flex; align-items: center; gap: 8px; font-size: 16px; }
      .frames-2 { margin-top: 12px; display: grid; grid-template-columns: 1fr; gap: 8px; }
      @media (min-width: 640px) { .frames-2 { grid-template-columns: 1fr 1fr; } }
      .official-note { margin-top: 12px; font-size: 12px; line-height: 1.625; color: var(--dim); }
      .frames-3 { margin-top: 20px; display: grid; grid-template-columns: 1fr; gap: 12px; }
      @media (min-width: 1024px) { .frames-3 { grid-template-columns: repeat(3, 1fr); } }

      /* ---------- filter chips ---------- */
      .filters { margin-top: 20px; }
      .filter-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .filter-chip {
        border-radius: 9999px; padding: 6px 14px; font-size: 14px; line-height: 1.5;
        background: var(--surface); color: var(--text); border: 1px solid var(--border);
      }
      .filter-chip[aria-pressed="true"] {
        background: var(--accent); color: var(--accent-ink); border-color: transparent;
      }

      /* ---------- avatars / crowns / game tag ---------- */
      .avatar-img { border-radius: 9999px; object-fit: cover; flex-shrink: 0; display: block; }
      .avatar-fallback {
        border-radius: 9999px; flex-shrink: 0; display: flex; align-items: center;
        justify-content: center; background: var(--surface-2); color: var(--accent-strong);
      }
      .crown { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; }
      .game-tag { display: inline-flex; height: 20px; max-width: 100%; align-items: center; gap: 4px; color: var(--text); }
      .game-tag svg { flex-shrink: 0; color: var(--dim); }
      .game-tag .gname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px; }
      .game-spacer { display: block; height: 20px; }
      .platform-viewers { display: flex; flex-shrink: 0; align-items: center; gap: 6px; font-size: 11px; line-height: 20px; }
      .pv-count { color: var(--dim); }

      /* ---------- playable thumbnail / embed ---------- */
      .thumb-box {
        position: relative; aspect-ratio: 16 / 9; width: 100%; flex-shrink: 0;
        overflow: hidden; background: var(--surface-2); display: block;
      }
      button.thumb-box { border: 0; padding: 0; text-align: left; font: inherit; color: inherit; }
      .thumb-still {
        position: absolute; inset: 0; width: 100%; height: 100%;
        border: 0; padding: 0; background: none; display: block; cursor: pointer;
      }
      .thumb-img { position: absolute; inset: 0; height: 100%; width: 100%; object-fit: cover; }
      .thumb-box iframe { position: absolute; inset: 0; height: 100%; width: 100%; border: 0; }
      .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .play-circle {
        display: flex; height: 48px; width: 48px; align-items: center; justify-content: center;
        border-radius: 9999px; background: rgba(0,0,0,0.6); color: #fff;
      }
      .live-badge {
        position: absolute; left: 8px; top: 8px; display: inline-flex; align-items: center;
        gap: 6px; border-radius: 9999px; background: rgba(0,0,0,0.7);
        padding: 4px 10px; font-size: 12px; color: #fff; z-index: 2;
      }
      .live-badge .live-dot { height: 8px; width: 8px; }
      .elapsed-pill {
        position: absolute; bottom: 8px; right: 8px; border-radius: 9999px;
        background: rgba(0,0,0,0.7); padding: 4px 10px; font-size: 12px; color: #fff; z-index: 2;
      }
      .embed-close {
        position: absolute; right: 8px; top: 8px; z-index: 10; display: inline-flex;
        align-items: center; gap: 4px; border-radius: 9999px; background: rgba(0,0,0,0.75);
        padding: 4px 10px; font-size: 12px; color: #fff; border: 0;
      }
      .embed-hint {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
        background: rgba(0,0,0,0.85); padding: 8px 12px; font-size: 12px; line-height: 20px; color: #fff;
      }
      .embed-hint p { margin: 0; }
      .embed-hint .hint-btns { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .hint-open {
        flex-shrink: 0; border-radius: 9999px; background: #fff; padding: 4px 10px;
        color: var(--accent-ink); text-decoration: none; font-size: 12px;
      }
      .hint-sub {
        flex-shrink: 0; border-radius: 9999px; background: rgba(255,255,255,0.2);
        padding: 4px 10px; color: #fff; border: 0; font-size: 12px;
      }

      /* ---------- live cards ---------- */
      .live-section { margin-top: 24px; }
      .live-grid { display: grid; grid-auto-rows: 1fr; grid-template-columns: 1fr; gap: 12px; }
      @media (min-width: 640px) { .live-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1280px) { .live-grid { grid-template-columns: repeat(4, 1fr); } }
      .live-card {
        display: flex; flex-direction: column; overflow: hidden;
        border-radius: var(--radius); background: var(--surface);
      }
      .live-card-body { display: flex; flex: 1; flex-direction: column; padding: 12px; }
      .card-name-row { display: flex; height: 32px; align-items: center; gap: 8px; }
      .card-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; line-height: 32px; color: var(--text); }
      .card-title {
        margin-top: 8px; display: block; height: 24px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; font-size: 16px; line-height: 24px;
        color: var(--text); text-decoration: none;
      }
      .card-title:hover { text-decoration: underline; text-underline-offset: 2px; }
      .game-row { margin-top: 4px; display: flex; height: 20px; align-items: center; gap: 8px; }
      .game-row .grow { display: flex; min-width: 0; flex: 1; align-items: center; }
      .no-live {
        border-radius: var(--radius); border: 1px solid var(--border);
        background: var(--surface); padding: 20px 16px; text-align: center;
        font-size: 14px; color: var(--dim);
      }

      /* ---------- roster ---------- */
      .roster { margin-top: 32px; }
      .all-grid { display: grid; grid-template-columns: 1fr; column-gap: 16px; row-gap: 24px; }
      @media (min-width: 640px) { .all-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1280px) { .all-grid { grid-template-columns: repeat(4, 1fr); } }
      .revengers-wrap { margin-top: 40px; }
      .team-head { display: flex; height: 32px; align-items: center; gap: 8px; font-size: 18px; }
      .team-dot { display: inline-block; height: 12px; width: 12px; flex-shrink: 0; border-radius: 9999px; }
      .team-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .team-count { flex-shrink: 0; font-size: 14px; color: var(--dim); }
      .team-count .live-n { color: var(--live); }
      .roster-list { overflow: hidden; border-radius: var(--radius); background: var(--surface); margin-top: 8px; }
      .stepped { position: relative; margin-top: 8px; display: grid; grid-template-columns: 1fr; align-items: start; }
      @media (min-width: 640px) { .stepped { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1280px) { .stepped { grid-template-columns: repeat(4, 1fr); } }
      .stepped svg.frame { position: absolute; left: 0; top: 0; pointer-events: none; }
      .stepped ul { position: relative; overflow: hidden; }
      .prow { border-bottom: 1px solid var(--border); }
      .prow:last-child { border-bottom: 0; }
      .prow-inner { padding: 10px 12px; }
      .prow-top { display: flex; align-items: flex-start; gap: 12px; }
      .avatar-link { flex-shrink: 0; border-radius: 9999px; text-decoration: none; display: block; }
      .avatar-link:hover { box-shadow: 0 0 0 2px var(--accent); }
      .prow-main { min-width: 0; flex: 1; }
      .prow-name { display: flex; height: 28px; align-items: center; gap: 6px; font-size: 18px; line-height: 28px; }
      .prow-name .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .prow-title {
        margin-top: 2px; height: 24px; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; font-size: 16px; line-height: 24px;
      }

      /* ---------- host card ---------- */
      .host-card {
        margin-top: 16px; border-radius: var(--radius); background: var(--surface);
        padding: 12px 16px; border: 1px solid var(--border);
      }
      .host-head { display: flex; width: 100%; column-gap: 10px; }
      .host-avatar-link { margin-top: 4px; flex-shrink: 0; align-self: flex-start; }
      .host-toggle {
        display: flex; min-width: 0; flex: 1; flex-wrap: wrap; align-items: center;
        column-gap: 10px; row-gap: 6px; text-align: left; background: none; border: 0;
        padding: 0; color: var(--text); font-size: 16px;
      }
      .host-name { min-width: 0; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; line-height: 32px; }
      .host-live-group { order: 3; display: flex; min-width: 0; flex-basis: 100%; align-items: center; gap: 8px; }
      @media (min-width: 640px) { .host-live-group { order: 0; flex-basis: auto; flex: 1; } }
      .host-live-group .gt-wrap { display: flex; min-width: 0; max-width: 45%; flex-shrink: 1; align-items: center; }
      .host-sep { flex-shrink: 0; color: var(--dim); }
      .host-stream-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; color: var(--text); }
      .host-offline { order: 3; min-width: 0; flex-basis: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; color: var(--dim); }
      @media (min-width: 640px) { .host-offline { order: 0; flex-basis: auto; flex: 1; } }
      .host-viewers { flex-shrink: 0; font-size: 11px; line-height: 20px; color: var(--dim); }
      .host-live-badge {
        display: inline-flex; flex-shrink: 0; align-items: center; gap: 6px;
        border-radius: 9999px; background: rgba(0,0,0,0.7); padding: 4px 10px;
        font-size: 12px; color: #fff;
      }
      .host-live-badge .live-dot { height: 8px; width: 8px; }
      .host-detail-live { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
      @media (min-width: 640px) { .host-detail-live { flex-direction: row; gap: 16px; } }
      .host-thumb { border-radius: var(--radius); overflow: hidden; }
      @media (min-width: 640px) { .host-thumb { width: 300px; } }
      .host-viewers-pill {
        position: absolute; bottom: 8px; right: 8px; border-radius: 9999px;
        background: rgba(0,0,0,0.7); padding: 4px 10px; font-size: 12px; color: #fff; z-index: 2;
      }
      .host-info { display: flex; min-width: 0; flex: 1; flex-direction: column; }
      .host-mrhyg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
      .host-detail-title {
        margin-top: 6px; display: block; font-size: 16px; line-height: 24px; color: var(--text);
        text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2;
        -webkit-box-orient: vertical; overflow: hidden;
      }
      .host-detail-title:hover { text-decoration: underline; text-underline-offset: 2px; }
      .host-game-row { margin-top: 4px; display: flex; height: 20px; align-items: center; }
      .host-meta-row { margin-top: auto; display: flex; width: 100%; flex-wrap: wrap; align-items: center; column-gap: 12px; row-gap: 8px; padding-top: 8px; }
      .host-meta { font-size: 12px; line-height: 20px; color: var(--dim); }
      .host-meta-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
      .twitch-chip {
        flex-shrink: 0; border-radius: 9999px; padding: 2px 10px; font-size: 12px;
        line-height: 20px; color: #fff; background: var(--twitch);
      }
      .watch-btn {

var playerHosts = {}; // key -> {el, login, name, watchUrl, restoreHtml}
function twitchEmbedSrc(login) {
var parent = "";
try { parent = window.location.hostname || "";} catch (e) { parent = "";}
return (
"https://player.twitch.tv/?channel=" + encodeURIComponent(login) +
(parent? "&parent=" + encodeURIComponent(parent): "") +
"&muted=true&autoplay=true"
);
}
function openPlayer(key) {
var rec = playerHosts[key];
if (!rec || openKeys.indexOf(key)!== -1) return;
openKeys.push(key);
while (openKeys.length > MAX_INLINE_PLAYERS) {
closePlayer(openKeys[0]);
}
renderEmbed(rec);
}
function closePlayer(key) {
var idx = openKeys.indexOf(key);
if (idx!== -1) openKeys.splice(idx, 1);
var rec = playerHosts[key];
if (rec && rec.playing) {
rec.playing = false;
if (rec.hintTimer) { window.clearTimeout(rec.hintTimer); rec.hintTimer = null;}
rec.el.innerHTML = rec.restoreHtml;
bindThumbButton(rec);
}
}
function renderEmbed(rec) {
rec.playing = true;
rec.responded = false;
var html =
'<iframe src="' + esc(twitchEmbedSrc(rec.login)) + '" title="' +
esc(rec.name) + 'の配信プレーヤー（Twitch）" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>' +
'<button type="button" class="embed-close" data-close="' + esc(rec.key) +
'" aria-label="' + esc(rec.name) + 'の再生を閉じる"><span aria-hidden="true">✕</span>閉じる</button>' +
'<div class="embed-hint" data-hint="' + esc(rec.key) + '" hidden>' +
"<p>再生が始まらない場合は、埋め込みがブロックされている可能性があります</p>" +
'<div class="hint-btns">' +
'<a class="hint-open" href="' + esc(rec.watchUrl) + '" target="_blank" rel="noreferrer" aria-label="' +
esc(rec.name) + 'の配信をTwitchで開く">Twitchで開く</a>' +
'<button type="button" class="hint-sub" data-reload="' + esc(rec.key) +
'" aria-label="' + esc(rec.name) + 'のプレーヤーを再読み込み">再読み込み</button>' +
'<button type="button" class="hint-sub" data-hintclose="' + esc(rec.key) +
'" aria-label="再生できない場合の案内を閉じる">✕</button>' +
"</div></div>";
rec.el.innerHTML = html;
rec.hintTimer = window.setTimeout(function () {
if (rec.playing &&!rec.responded) {
var hint = rec.el.querySelector("[data-hint]");
if (hint) hint.hidden = false;
}
}, 15000);
}
window.addEventListener("message", function (e) {
if (e.origin!== "https://player.twitch.tv") return;
Object.keys(playerHosts).forEach(function (k) {
var rec = playerHosts[k];
if (rec.playing) {
rec.responded = true;
var hint = rec.el.querySelector("[data-hint]");
if (hint) hint.hidden = true;
}
});
});
function bindThumbButton(rec) {
var btn = rec.el.querySelector("[data-open]");
if (btn) {
btn.addEventListener("click", function () { openPlayer(rec.key);});
}
}
// A live thumbnail that can swap in place for the Twitch embed.
// The outer div.thumb-box (data-thumb) is the registered host
// element; its content is either the still button (kept in
// thumbRestores for restoring) or the embed player.
var thumbRestores = {};
function playableThumb(opts) {
// opts: key, login, name, thumbnailUrl, watchUrl, extraClass, badgesHtml
var badges = opts.badgesHtml || "";
var stillBtn =
'<button type="button" class="thumb-still" data-open="' + esc(opts.key) +
'" aria-label="' + esc(opts.name) + 'の配信をその場で再生（Twitch）">' +
'<img class="thumb-img" src="' + esc(opts.thumbnailUrl) + '" alt="' +
esc(opts.name) + 'の配信サムネイル" loading="lazy" />' + badges +
'<span class="play-overlay" aria-hidden="true"><span class="play-circle">' +
'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>' +
"</span></span></button>";
thumbRestores[opts.key] = stillBtn;
var markup =
'<div class="thumb-box ' + (opts.extraClass || "") + '" data-thumb="' +
esc(opts.key) + '">' + stillBtn + "</div>";
return { markup: markup };
}
function registerThumb(key, login, name, watchUrl, restoreHtml) {
var el = document.querySelector('[data-thumb="' + key + '"]');
if (!el) return;
// The registered element is the outer box; for cards the button
// itself is the box, for the host the box wraps the button.
var rec = {
key: key, el: el, login: login, name: name, watchUrl: watchUrl,
restoreHtml: restoreHtml, playing: false, responded: false, hintTimer: null,
};
playerHosts[key] = rec;
bindThumbButton(rec);
}

      // ---------- stepped frame (SVG outline measured from columns) ----------
      function roundedLoopPath(pts, radius) {
        var n = pts.length;
        var v = [];
        for (var k = 0; k < n; k++) {
          var prev = pts[(k + n - 1) % n], cur = pts[k], next = pts[(k + 1) % n];
          var cross = (cur[0] - prev[0]) * (next[1] - cur[1]) - (cur[1] - prev[1]) * (next[0] - cur[0]);
          if (cross !== 0) v.push(cur);
        }
        var m = v.length;
        if (m < 2) return "";
        var a = [], b = [], rs = [], sw = [];
        for (var k2 = 0; k2 < m; k2++) {
          var p0 = v[(k2 + m - 1) % m], c0 = v[k2], n0 = v[(k2 + 1) % m];
          var d1x = Math.sign(c0[0] - p0[0]), d1y = Math.sign(c0[1] - p0[1]);
          var d2x = Math.sign(n0[0] - c0[0]), d2y = Math.sign(n0[1] - c0[1]);
          var len1 = Math.abs(c0[0] - p0[0]) + Math.abs(c0[1] - p0[1]);
          var len2 = Math.abs(n0[0] - c0[0]) + Math.abs(n0[1] - c0[1]);
          var r = Math.min(radius, len1 / 2, len2 / 2);
          a.push([c0[0] - d1x * r, c0[1] - d1y * r]);
          b.push([c0[0] + d2x * r, c0[1] + d2y * r]);
          rs.push(r);
          sw.push(d1x * d2y - d1y * d2x > 0 ? 1 : 0);
        }
        var d = "M " + b[m - 1][0] + " " + b[m - 1][1];
        for (var k3 = 0; k3 < m; k3++) {
          d += " L " + a[k3][0] + " " + a[k3][1] + " A " + rs[k3] + " " + rs[k3] + " 0 0 " + sw[k3] + " " + b[k3][0] + " " + b[k3][1];
        }
        return d + " Z";
      }
      function steppedFramePaths(rects, radius) {
        var xsSet = {}, ysSet = {};
        rects.forEach(function (r) { xsSet[r.x] = 1; xsSet[r.x + r.w] = 1; ysSet[r.y] = 1; ysSet[r.y + r.h] = 1; });
        var xs = Object.keys(xsSet).map(Number).sort(function (p, q) { return p - q; });
        var ys = Object.keys(ysSet).map(Number).sort(function (p, q) { return p - q; });
        var nx = xs.length - 1, ny = ys.length - 1;
        if (nx < 1 || ny < 1) return { outline: "", dividers: "" };
        var covered = [];
        for (var j = 0; j < ny; j++) {
          var row = [];
          for (var i = 0; i < nx; i++) {
            var cx = (xs[i] + xs[i + 1]) / 2, cy = (ys[j] + ys[j + 1]) / 2;
            row.push(rects.some(function (r) { return cx > r.x && cx < r.x + r.w && cy > r.y && cy < r.y + r.h; }));
          }
          covered.push(row);
        }
        function cov(i2, j2) { return i2 >= 0 && i2 < nx && j2 >= 0 && j2 < ny && covered[j2][i2]; }
        var nexts = {};
        function addSeg(ax, ay, bx, by) {
          var k = ax + "," + ay;
          if (nexts[k]) nexts[k].push([bx, by]); else nexts[k] = [[bx, by]];
        }
        var vSegs = {}, hSegs = {};
        function addTo(map, at, from, to) {
          if (map[at]) map[at].push([from, to]); else map[at] = [[from, to]];
        }
        for (var jj = 0; jj < ny; jj++) {
          for (var ii = 0; ii < nx; ii++) {
            if (!cov(ii, jj)) continue;
            var x0 = xs[ii], x1 = xs[ii + 1], y0 = ys[jj], y1 = ys[jj + 1];
            if (!cov(ii, jj - 1)) addSeg(x0, y0, x1, y0);
            if (!cov(ii, jj + 1)) addSeg(x1, y1, x0, y1);
            if (!cov(ii - 1, jj)) addSeg(x0, y1, x0, y0);
            if (!cov(ii + 1, jj)) addSeg(x1, y0, x1, y1);
            if (cov(ii + 1, jj)) addTo(vSegs, x1, y0, y1);
            if (cov(ii, jj + 1)) addTo(hSegs, y1, x0, x1);
          }
        }
        var loops = [];
        while (Object.keys(nexts).length > 0) {
          var firstKey = Object.keys(nexts)[0];
          var parts = firstKey.split(",").map(Number);
          var sx = parts[0], sy = parts[1];
          var loop = [[sx, sy]];
          var cx2 = sx, cy2 = sy;
          for (;;) {
            var arr = nexts[cx2 + "," + cy2];
            if (!arr || arr.length === 0) break;
            var nxt = arr.pop();
            if (arr.length === 0) delete nexts[cx2 + "," + cy2];
            cx2 = nxt[0]; cy2 = nxt[1];
            if (cx2 === sx && cy2 === sy) break;
            loop.push([cx2, cy2]);
          }
          if (loop.length >= 4) loops.push(loop);
        }
        var outline = loops.map(function (l) { return roundedLoopPath(l, radius); }).join(" ");
        function mergeRuns(map, vertical) {
          var d = "";
          Object.keys(map).forEach(function (atKey) {
            var at = Number(atKey);
            var segs = map[atKey].slice().sort(function (p, q) { return p[0] - q[0]; });
            var start = segs[0] && segs[0][0], end = segs[0] && segs[0][1];
            function flush() {
              if (start === undefined || end === undefined) return;
              d += vertical ? "M " + at + " " + start + " L " + at + " " + end + " " : "M " + start + " " + at + " L " + end + " " + at + " ";
            }
            for (var s = 1; s < segs.length; s++) {
              var f = segs[s][0], t = segs[s][1];
              if (end !== undefined && f <= end) { if (t > end) end = t; }
              else { flush(); start = f; end = t; }
            }
            flush();
          });
          return d;
        }
        return { outline: outline, dividers: mergeRuns(vSegs, true) + mergeRuns(hSegs, false) };
      }
      var steppedContainers = [];
      function measureStepped(container) {
        var cols = container.querySelectorAll("ul[data-col]");
        if (cols.length === 0) return;
        var base = container.getBoundingClientRect();
        var rects = [];
        for (var i = 0; i < cols.length; i++) {
          var r = cols[i].getBoundingClientRect();
          rects.push({
            x: Math.round(r.left - base.left), y: Math.round(r.top - base.top),
            w: Math.round(r.width), h: Math.round(r.height),
          });
        }
        var paths = steppedFramePaths(rects, 14);
        var w = Math.round(base.width), h = Math.round(base.height);
        var svg = container.querySelector("svg.frame");
        if (!svg) {
          svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "frame");
          svg.setAttribute("aria-hidden", "true");
          container.insertBefore(svg, container.firstChild);
        }
        var color = container.getAttribute("data-color") || "var(--border)";
        svg.setAttribute("width", w);
        svg.setAttribute("height", h);
        svg.setAttribute("viewBox", "0 0 " + w + " " + h);
        svg.innerHTML =
          '<path d="' + paths.outline + '" fill="var(--surface)" stroke="' + color + '" stroke-width="2"/>' +
          '<path d="' + paths.dividers + '" fill="none" stroke="var(--border)" stroke-width="2"/>';
      }
      function initStepped() {
        steppedContainers = Array.prototype.slice.call(document.querySelectorAll(".stepped"));
        steppedContainers.forEach(measureStepped);
        if (window.ResizeObserver) {
          steppedContainers.forEach(function (c) {
            if (c.__roObserved) return;
            c.__roObserved = true;
            var ro = new ResizeObserver(function () { measureStepped(c); });
            ro.observe(c);
            Array.prototype.forEach.call(c.querySelectorAll("ul[data-col]"), function (ul) {
              ro.observe(ul);
            });
          });
        }
      }
      window.addEventListener("load", function () {
        steppedContainers.forEach(measureStepped);
      });
      var resizeTimer = null;
      window.addEventListener("resize", function () {
        if (resizeTimer) window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(function () {
          steppedContainers.forEach(measureStepped);
        }, 120);
      });

      function chunkMembers(members, columns) {
        var count = Math.min(columns, members.length);
        var base = Math.floor(members.length / count);
        var rem = members.length % count;
        var chunks = [], idx = 0;
        for (var c = 0; c < count; c++) {
          var size = base + (c < rem ? 1 : 0);
          chunks.push(members.slice(idx, idx + size));
          idx += size;
        }
        return chunks;
      }
      function teamBlockHtml(team, members, columns) {
        var liveCount = members.filter(function (p) { return p.live; }).length;
        var head =
          '<h2 class="team-head"><span class="team-dot" aria-hidden="true" style="background:' +
          team.dot + '"></span><span class="team-label">' + esc(team.label) +
          '</span><span class="team-count">' + members.length + "人" +
          (liveCount > 0 ? '<span class="live-n"> ・ ' + liveCount + "人配信中</span>" : "") +
          "</span></h2>";
        var body;
        if (columns && columns > 1 && members.length > 1) {
          var chunks = chunkMembers(members, columns);
          body =
            '<div class="stepped" data-color="' + team.dot + '">' +
            chunks.map(function (chunk) {
              return "<ul data-col>" + chunk.map(playerRowHtml).join("") + "</ul>";
            }).join("") + "</div>";
        } else {
          body =
            '<ul class="roster-list" style="border:2px solid ' + team.dot + '">' +
            members.map(playerRowHtml).join("") + "</ul>";
        }
        return "<div>" + head + body + "</div>";
      }

      // ---------- live page assembly ----------
      var currentFilter = "all";
      function officialSectionHtml() {
        return (

      function eventCountdownText() {
        var parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Tokyo", year: "numeric", month: "numeric", day: "numeric",
        }).formatToParts(new Date());
        var get = function (type) {
          for (var i = 0; i < parts.length; i++) if (parts[i].type === type) return Number(parts[i].value);
          return 0;
        };
        var todayUtc = Date.UTC(get("year"), get("month") - 1, get("day"));
        var day1Utc = Date.UTC(2026, 10, 28);
        var diff = Math.round((day1Utc - todayUtc) / 86400000);
        if (diff > 0) return "あと" + diff + "日";
        if (diff === 0) return "本日 DAY1";
        if (diff === -1) return "本日 DAY2（最終日）";
        return "終了しました";
      }

        if (reload) {
          var rec = playerHosts[reload.getAttribute("data-reload")];
          if (rec) { rec.responded = false; renderEmbed(rec); }
          return;
        }
        var hc = t.closest("[data-hintclose]");
        if (hc) {
          var rec2 = playerHosts[hc.getAttribute("data-hintclose")];
          if (rec2) {
            var hint = rec2.el.querySelector("[data-hint]");
            if (hint) hint.hidden = true;
            if (rec2.hintTimer) window.clearTimeout(rec2.hintTimer);
          }
        }
      });

      renderBadge();
      renderLivePage();
      renderSchedulePage();
    </script>
  </body>
</html>
